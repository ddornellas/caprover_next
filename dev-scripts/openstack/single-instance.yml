heat_template_version: 2018-08-31

description: OpenStack Heat template to deploy a single VM running CapRover.

parameters:
  image_id:
    type: string
    label: Image ID
    description: Image to be used for compute instance. Ubuntu is recommended.
  instance_type:
    type: string
    label: Instance Type
    description: Type of instance (flavor) to be used
  network:
    type: string
    label: Network
    description: Network for the instance

resources:
  inbound_ssh_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: inbound_ssh_security_group
      description: Security Group for allowing SSH access
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0  # Allows ingress from any IP address
  inbound_http_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: inbound_http_security_group
      description: Security Group for allowing HTTP access
      rules:
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: 0.0.0.0/0  # Allows ingress from any IP address
  inbound_https_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: inbound_https_security_group
      description: Security Group for allowing HTTPS access
      rules:
        - protocol: tcp
          port_range_min: 443
          port_range_max: 443
          remote_ip_prefix: 0.0.0.0/0  # Allows ingress from any IP address
  inbound_caprover_install_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: inbound_caprover_install_security_group
      description: Security Group for allowing access to port 3000, which is used for CapRover setup.
      rules:
        - protocol: tcp
          port_range_min: 3000
          port_range_max: 3000
          remote_ip_prefix: 0.0.0.0/0  # Allows ingress from any IP address
  caprover_manager:
    type: OS::Nova::Server
    properties:
      key_name: caprover
      image: { get_param: image_id }
      flavor: { get_param: instance_type }
      networks:
        - network: { get_param: network }
      security_groups:
        - default
        - get_resource: inbound_ssh_security_group
        - get_resource: inbound_http_security_group
        - get_resource: inbound_https_security_group
        - get_resource: inbound_caprover_install_security_group
      user_data: |
        #!/bin/bash
        set -e

        echo "Installing CapRover Next with the versioned VM installer"
        apt-get update
        apt-get install -y ca-certificates curl
        CAPROVER_VERSION=1.15.0
        INSTALL_DIR=/run/caprover-next-install
        install -d -m 0700 "$INSTALL_DIR"
        curl --fail --silent --show-error --location \
          --output "$INSTALL_DIR/caprover-next-install" \
          "https://github.com/ddornellas/caprover_next/releases/download/v${CAPROVER_VERSION}/caprover-next-install"
        curl --fail --silent --show-error --location \
          --output "$INSTALL_DIR/checksums.txt" \
          "https://github.com/ddornellas/caprover_next/releases/download/v${CAPROVER_VERSION}/checksums.txt"
        (cd "$INSTALL_DIR" && sha256sum -c checksums.txt)
        chmod 0755 "$INSTALL_DIR/caprover-next-install"
        "$INSTALL_DIR/caprover-next-install" install \
          --version "$CAPROVER_VERSION" \
          --configure-firewall \
          --allow-public-admin \
          --non-interactive \
          --accept-terms
