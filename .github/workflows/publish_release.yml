name: Build and publish the CapRover Next release

on:
    push:
        branches:
            - release

permissions:
    contents: read

jobs:
    run-pre-checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 24
            - name: Prepare runtime directory
              run: sudo install -d -o "$USER" /captain
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm run formatter
            - run: npm run test:all
    build-publish-docker-hub:
        needs: run-pre-checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Log in to Docker Hub
              env:
                  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: |
                  printf '%s' "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin
            - name: Build and push CapRover Next to Docker Hub
              shell: bash
              run: ./dev-scripts/build_and_push_release.sh
            - name: Package the VM installer
              shell: bash
              run: |
                  install -d release-artifacts
                  install -m 0755 install/caprover-next-install release-artifacts/caprover-next-install
                  (cd release-artifacts && sha256sum caprover-next-install > checksums.txt)
                  tar -C release-artifacts -czf release-artifacts/caprover-next-installer.tar.gz caprover-next-install checksums.txt
            - name: Upload VM installer artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: caprover-next-installer
                  path: release-artifacts/
